name: build-windows
on:
  workflow_dispatch: {}
  push:
    branches: [main]
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: src-tauri }

      - name: Download FFmpeg
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force src-tauri/bin | Out-Null
          Invoke-WebRequest https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip -OutFile ff.zip
          Expand-Archive ff.zip -DestinationPath ff
          $f = Get-ChildItem ff -Recurse -Filter ffmpeg.exe | Select-Object -First 1
          Copy-Item $f.FullName src-tauri/bin/ffmpeg.exe

      # Optional: offline speech-to-text engine for auto-captions. If anything here fails the
      # app still builds; the captions button then explains that the engine is missing.
      - name: Download whisper.cpp (auto-captions)
        continue-on-error: true
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $rel = Invoke-RestMethod -Headers @{Authorization="Bearer $env:GH_TOKEN"} https://api.github.com/repos/ggml-org/whisper.cpp/releases/latest
          $asset = $rel.assets | Where-Object { $_.name -match '^whisper-bin-x64\.zip$' } | Select-Object -First 1
          if (-not $asset) { Write-Warning "whisper release asset not found"; exit 0 }
          Invoke-WebRequest $asset.browser_download_url -OutFile whisper.zip
          Expand-Archive whisper.zip -DestinationPath whisper
          $cli = Get-ChildItem whisper -Recurse -Filter whisper-cli.exe | Select-Object -First 1
          Copy-Item (Join-Path $cli.DirectoryName '*') src-tauri/bin/whisper -Recurse -Force
          Invoke-WebRequest https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-base.bin -OutFile src-tauri/bin/whisper/ggml-base.bin

      - run: npm install
      - run: npx tauri icon app-icon.png
      - run: npx tauri build
      - uses: actions/upload-artifact@v4
        with:
          name: RustCut-installer
          path: src-tauri/target/release/bundle/nsis/*.exe
